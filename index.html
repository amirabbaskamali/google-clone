<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Google Demo</title>
  <link rel="stylesheet" href="css/style.css">

</head>
<body>
  <header>
    <nav class="top-nav">
      <a href="https://mail.google.com/mail/u/0/?tab=rm&ogbl" class="nav-link" target="_blank">Gmail</a>
      <a href="https://www.google.com/imghp?hl=en&tab=ri&ogbl" class="nav-link" target="_blank">Images</a>
      <img src="assets/icons/google-app.png" alt="Google Apps" class="top-icon app-icon" draggable="false">
      <img src="assets/icons/account.png" alt="Profile" class="top-icon profile-icon" draggable="false">
    </nav>
  </header>

  <main class="main-content">
    

    <div class="google-logo-text">Google Demo UI</div>

    
    <div class="search-box">
      <div class="search-container">
        <img src="assets/icons/search.png" alt="Search" class="search-icon left-icon">
        <input
          type="text"
          class="search-input"
          placeholder="search google or type url"
          dir="ltr"
          spellcheck="false"
          autocomplete="off"
        >
        <div class="right-icons">
          <img src="assets/icons/mic.png" alt="Search by voice" class="search-icon">
          <img src="assets/icons/lens.png" alt="Search by image" class="search-icon">
          <a href="https://www.google.com/search?sourceid=chrome&udm=50&aep=42" target="_blank">
            <img src="assets/icons/ai-mode.png" alt="AI Mode" class="search-icon ai-mode-icon">
          </a>
        </div>
      </div>

      <div class="search-buttons">
        <button class="search-btn" id="google-search">Google Search</button>
        <button class="search-btn" id="lucky">I'm Feeling Lucky</button>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
<footer class="google-footer">
  <div class="footer-content">
    <div class="footer-left">
      <a href="https://about.google/" target="_blank">About</a>
      <a href="https://ads.google.com/" target="_blank">Advertising</a>
      <a href="https://www.google.com/services/" target="_blank">Business</a>
      <a href="https://www.google.com/search/howsearchworks/" target="_blank">How Search works</a>
    </div>
    <div class="footer-right">
      <a href="https://policies.google.com/privacy" target="_blank">Privacy</a>
      <a href="https://policies.google.com/terms" target="_blank">Terms</a>
      <a href="https://myaccount.google.com/" target="_blank">Settings</a>
    </div>
  </div>
</footer>
</html>
